services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # FalkorDB (Redis protocol)
      - "3000:3000"   # FalkorDB Browser
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Always the local, passwordless FalkorDB, even if .env holds FalkorDB Cloud credentials.
      FALKOR_HOST: falkordb
      FALKOR_PORT: "6379"
      FALKOR_USERNAME: ""
      FALKOR_PASSWORD: ""
      FALKOR_SSL: "false"
    depends_on:
      falkordb:
        condition: service_healthy
