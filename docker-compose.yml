services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # FalkorDB (Redis protocol)
      - "3000:3000"   # FalkorDB Browser
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FALKOR_HOST: falkordb
      FALKOR_PORT: "6379"
    depends_on:
      falkordb:
        condition: service_healthy
