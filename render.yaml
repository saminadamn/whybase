# Render Blueprint: one Docker web service. With FALKOR_HOST unset or localhost, the image runs
# its bundled FalkorDB in the same container (in-memory; Kettle Labs is reseeded on every start).
# To use FalkorDB Cloud instead, set FALKOR_HOST/PORT/USERNAME/PASSWORD and FALKOR_SSL=true (see docs/DEPLOY.md).
# Values marked sync: false are prompted for in the Render dashboard and never stored in git.
services:
  - type: web
    name: whybase
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GRAPH_NAME
        value: whybase
      - key: LLM_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
